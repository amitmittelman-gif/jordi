<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: all;
      cursor: pointer;
    }

    /* ── Photo slides ── */
    .photo-frame {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .photo-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    .photo-frame img.visible { opacity: 1; }

    /* ── Placeholder (shown when no photos are configured yet) ── */
    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #f5f5f5;
    }

    .placeholder .ph-label {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 700;
      color: #d0d0d0;
      letter-spacing: -0.02em;
    }

    .placeholder .ph-hint {
      font-size: 0.9rem;
      color: #c0c0c0;
    }

    /* ── Video slides ── */
    .video-frame {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-nav-hint {
      position: absolute;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      color: #444;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }

    /* ── Photo progress bar (top of screen) ── */
    #photo-progress {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      background: rgba(0,0,0,0.18);
      z-index: 300;
      pointer-events: none;
      width: 0%;
    }

    /* ── Navigation dots ── */
    #nav-dots {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 200;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(0,0,0,0.18);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      flex-shrink: 0;
    }

    .dot.active {
      background: rgba(0,0,0,0.6);
      transform: scale(1.35);
    }

    /* ── Slide counter ── */
    #counter {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      color: rgba(0,0,0,0.28);
      z-index: 200;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

<div id="photo-progress"></div>
<div id="nav-dots"></div>

// ═══════════════════════════════════════════════════════════════════
//  ENGINE — no need to edit below this line
// ═══════════════════════════════════════════════════════════════════

const stage       = document.getElementById('stage');
const navDots     = document.getElementById('nav-dots');
const counter     = document.getElementById('counter');
const progressBar = document.getElementById('photo-progress');

let current = 0;
const photoTimers = {};

// ── Build DOM ──────────────────────────────────────────────────────
SLIDES.forEach((slide, i) => {
  const el = document.createElement('div');
  el.className = 'slide';
  el.id = `slide-${i}`;

  if (slide.type === 'photos') {
    if (slide.photos && slide.photos.length > 0) {
      const frame = document.createElement('div');
      frame.className = 'photo-frame';
      slide.photos.forEach((src, pi) => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        if (pi === 0) img.classList.add('visible');
        frame.appendChild(img);
      });
      el.appendChild(frame);
    } else {
      el.appendChild(makePlaceholder(slide.label || `Slide ${i}`, 'Add photos to SLIDES config'));
    }
    el.addEventListener('click', () => navigate(1));

  } else if (slide.type === 'video') {
    const frame = document.createElement('div');
    frame.className = 'video-frame';

    if (slide.youtube && slide.youtube !== 'YOUTUBE_ID_HERE') {
      const iframe = document.createElement('iframe');
      iframe.dataset.ytSrc = `https://www.youtube.com/embed/${slide.youtube}?rel=0`;
      iframe.allowFullscreen = true;
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      frame.appendChild(iframe);
    } else {
      frame.appendChild(makePlaceholder(slide.label || 'Video', 'Set youtube ID in SLIDES config', '#111', '#555'));
    }

    const hint = document.createElement('div');
    hint.className = 'video-nav-hint';
    hint.textContent = 'Press → or click outside the video to continue';
    frame.appendChild(hint);
    el.appendChild(frame);
    el.addEventListener('click', () => navigate(1));
  }

  stage.appendChild(el);

  // Nav dot
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.title = slide.label || `Slide ${i + 1}`;
  dot.addEventListener('click', e => { e.stopPropagation(); goTo(i); });
  navDots.appendChild(dot);
});

function makePlaceholder(label, hint, bg = '#f5f5f5', color = '#c8c8c8') {
  const ph = document.createElement('div');
  ph.className = 'placeholder';
  ph.style.background = bg;
  ph.innerHTML = `<div class="ph-label" style="color:${color}">${label}</div><div class="ph-hint" style="color:${color}">${hint}</div>`;
  return ph;
}

// ── Navigation ─────────────────────────────────────────────────────
function goTo(index) {
  if (index < 0 || index >= SLIDES.length) return;

  stopPhotoCycle(current);
  unloadVideo(current);
  document.getElementById(`slide-${current}`)?.classList.remove('active');
  document.querySelectorAll('.dot')[current]?.classList.remove('active');

  current = index;

  document.getElementById(`slide-${current}`)?.classList.add('active');
  document.querySelectorAll('.dot')[current]?.classList.add('active');
  counter.textContent = `${current + 1} / ${SLIDES.length}`;

  const slide = SLIDES[current];
  if (slide.type === 'photos' && slide.photos && slide.photos.length > 1) {
    startPhotoCycle(current);
  }
  if (slide.type === 'video') {
    loadVideo(current);
  }
}

function navigate(dir) { goTo(current + dir); }

// ── Photo cycling ──────────────────────────────────────────────────
function startPhotoCycle(i) {
  const slide = SLIDES[i];
  const el    = document.getElementById(`slide-${i}`);
  if (!el) return;
  const imgs = el.querySelectorAll('img');
  if (imgs.length < 2) return;

  let pi = 0;
  const interval = slide.interval || 3000;

  function tick() {
    imgs[pi].classList.remove('visible');
    pi = (pi + 1) % imgs.length;
    imgs[pi].classList.add('visible');
    animateProgress(interval);
    photoTimers[i] = setTimeout(tick, interval);
  }

  animateProgress(interval);
  photoTimers[i] = setTimeout(tick, interval);
}

function stopPhotoCycle(i) {
  clearTimeout(photoTimers[i]);
  delete photoTimers[i];
  progressBar.style.transition = 'none';
  progressBar.style.width = '0%';
}

function animateProgress(duration) {
  progressBar.style.transition = 'none';
  progressBar.style.width = '0%';
  requestAnimationFrame(() => {
    progressBar.style.transition = `width ${duration}ms linear`;
    progressBar.style.width = '100%';
  });
}

// ── Video loading ──────────────────────────────────────────────────
function loadVideo(i) {
  const iframe = document.querySelector(`#slide-${i} iframe[data-yt-src]`);
  if (iframe) iframe.src = iframe.dataset.ytSrc;
}

function unloadVideo(i) {
  const iframe = document.querySelector(`#slide-${i} iframe[data-yt-src]`);
  if (iframe) iframe.src = '';
}

// ── Keyboard ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const fwd = ['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'];
  const bwd = ['ArrowLeft',  'ArrowUp',          'PageUp'];
  if (fwd.includes(e.key)) { e.preventDefault(); navigate(1); }
  if (bwd.includes(e.key)) { e.preventDefault(); navigate(-1); }
  if (e.key === 'Home')    { e.preventDefault(); goTo(0); }
  if (e.key === 'End')     { e.preventDefault(); goTo(SLIDES.length - 1); }
});

// ── Init ───────────────────────────────────────────────────────────
goTo(0);
</script>
